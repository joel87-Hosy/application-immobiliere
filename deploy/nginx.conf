# Replace immo.example.com and obtain a certificate before enabling this server.
server {
 listen 80;
 server_name immo.example.com;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name immo.example.com;
 ssl_certificate /etc/letsencrypt/live/immo.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/immo.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 client_max_body_size 11m;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location / {
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 40s;
 }
 location ~ /\. { deny all; }
}
